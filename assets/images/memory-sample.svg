      <stop offset="1" stop-color="#202943"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d0c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f4d0c4" stop-opacity="0"/>
    </linearGradient>
