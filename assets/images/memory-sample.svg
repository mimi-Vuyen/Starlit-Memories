<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title description">
  <title id="title">Một chiều bình yên bên bờ biển</title>
  <desc id="description">Minh họa bầu trời xanh tím lúc hoàng hôn, mặt trời lavender và mặt biển lặng.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a3c"/>
      <stop offset=".48" stop-color="#554b83"/>
      <stop offset=".76" stop-color="#c08eb7"/>
      <stop offset="1" stop-color="#f0b89f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
