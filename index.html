<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b1b">
  <meta name="description" content="Một món quà sinh nhật nhỏ đang đợi Tỷ.">
  <title>Starlit Memories — Một món quà nhỏ</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/stars.js" defer></script>
  <script src="js/memories.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <canvas class="starfield" aria-hidden="true"></canvas>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="invitation" aria-labelledby="invitation-title">
    <p class="eyebrow">STARLIT MEMORIES</p>

    <div class="envelope" aria-hidden="true">
      <div class="envelope__glow"></div>
      <div class="envelope__body">
        <div class="envelope__letter"></div>
        <div class="envelope__flap"></div>
        <div class="envelope__seal"></div>
      </div>
    </div>

    <section class="invitation__content" aria-live="polite">
      <h1 id="invitation-title">Có một món quà nhỏ đang đợi Tỷ...</h1>
      <p class="invitation__message" id="invitation-message" hidden>
        Một hành trình nhỏ, dành riêng cho Tỷ.
      </p>
      <button class="button" id="start-button" type="button">Chạm để bắt đầu</button>
      <button class="button button--quiet" id="continue-button" type="button" hidden>
        Tiếp tục
      </button>
      <p class="invitation__notice" id="next-chapter-notice" role="status" hidden>
        Chương tiếp theo đang được chuẩn bị
      </p>
    </section>

    <p class="invitation__footnote">Một điều dịu dàng đang chờ được mở ra</p>
  </main>
</body>
</html>
